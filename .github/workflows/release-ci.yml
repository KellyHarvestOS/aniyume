name: Release CI

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Frontend release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker-smoke:
    name: Frontend Docker smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --target prod-like -t aniyume-web:release-smoke .

  release-image:
    name: Build and publish release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - checks
      - docker-smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare GHCR image name
        id: image
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aniyume-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image_name }}
          tags: |
            type=raw,value=release
            type=sha,prefix=release-,format=short
            type=raw,value=release-${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=aniyume-web
            org.opencontainers.image.description=Aniyume web release candidate image

      - name: Build and push immutable Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod-like
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT }}
            NEXT_PUBLIC_REVERB_SCHEME=${{ vars.NEXT_PUBLIC_REVERB_SCHEME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release image summary
        run: |
          echo "Published release image tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "No production deployment is executed by this workflow."
